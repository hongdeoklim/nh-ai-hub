name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 는 로컬(Windows)과 러너의 npm 버전이 @tailwindcss/oxide-wasm32-wasi 의
      # 번들 optional 의존(@emnapi/*)을 다르게 락에 기록해 EUSAGE 로 계속 깨진다.
      # 락파일 위생 정리(단일 npm 버전으로 재생성) 후 npm ci 로 복원할 것.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 2026-10 개편 8단계에서 src 린트 오류 0건으로 정리 → 차단 게이트.
      # (Supabase Edge Function 등 Deno 코드는 eslint.config.js globalIgnores 로 제외 — deno lint 로 별도 검사)
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
