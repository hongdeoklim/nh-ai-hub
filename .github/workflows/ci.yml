name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 기존 코드에 lint 에러 260건이 누적돼 있어 우선 참고용(non-blocking)으로 둔다.
      # 부채 청산 후 continue-on-error 를 제거해 차단 게이트로 전환할 것. (기획안 Phase 3-7)
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build
