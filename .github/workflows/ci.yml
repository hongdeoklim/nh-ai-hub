name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 는 로컬(Windows)과 러너의 npm 버전이 @tailwindcss/oxide-wasm32-wasi 의
      # 번들 optional 의존(@emnapi/*)을 다르게 락에 기록해 EUSAGE 로 계속 깨진다.
      # 락파일 위생 정리(단일 npm 버전으로 재생성) 후 npm ci 로 복원할 것.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 기존 코드에 lint 에러 260건이 누적돼 있어 우선 참고용(non-blocking)으로 둔다.
      # 부채 청산 후 continue-on-error 를 제거해 차단 게이트로 전환할 것. (기획안 Phase 3-7)
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build
