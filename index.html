<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="NH-AX-HUB — 농협네트웍스 임직원 전용 생성형 AI 업무 포털" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1211" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NH-AX-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/Pretendard-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Pretendard-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>NH-AX-HUB</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('nh_theme');
          var dark =
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <style>
      /* 초기 스플래시 — 번들 로드 전 1회 표시 (px 단위: 루트 폰트 변경에 영향받지 않음) */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f5f7f4;
      }
      html.dark,
      html.dark body {
        background-color: #0e1211;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(15, 138, 79, 0.16) 0%, transparent 60%),
          radial-gradient(ellipse 70% 50% at 50% 100%, rgba(23, 87, 184, 0.14) 0%, transparent 60%),
          #f5f7f4;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease-out;
      }
      html.dark #initial-splash {
        background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(52, 199, 123, 0.18) 0%, transparent 60%),
          radial-gradient(ellipse 70% 50% at 50% 100%, rgba(107, 163, 242, 0.16) 0%, transparent 60%),
          #0e1211;
      }
      .splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #0f8a4f 0%, #1757b8 100%);
        box-shadow: 0 12px 32px -8px rgba(15, 138, 79, 0.45);
        animation: splash-in 0.6s ease-out;
      }
      .splash-title {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #15201a;
        animation: splash-in 0.6s ease-out 0.05s both;
      }
      html.dark .splash-title {
        color: #ecf1ee;
      }
      .splash-subtitle {
        margin-top: 4px;
        font-size: 13px;
        font-weight: 500;
        color: #56655d;
        letter-spacing: 0.04em;
        animation: splash-in 0.6s ease-out 0.1s both;
      }
      html.dark .splash-subtitle {
        color: #a5b0aa;
      }
      .splash-loader {
        margin-top: 28px;
        width: 28px;
        height: 28px;
        border: 3px solid rgba(15, 138, 79, 0.18);
        border-top-color: #0f8a4f;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-title,
        .splash-subtitle,
        .splash-loader {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="initial-splash" role="status" aria-label="NH-AX-HUB 불러오는 중">
      <div class="splash-mark">NH</div>
      <div class="splash-title">NH-AX-HUB</div>
      <div class="splash-subtitle">농협네트웍스 · Evolution to AI</div>
      <div class="splash-loader"></div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('initial-splash');
        if (!splash) return;
        var shown = false;
        try {
          shown = sessionStorage.getItem('splashShown') === 'true';
        } catch (e) {}
        if (shown) {
          splash.remove();
          return;
        }
        try {
          sessionStorage.setItem('splashShown', 'true');
        } catch (e) {}
        var reduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.addEventListener('load', function () {
          setTimeout(
            function () {
              splash.style.opacity = '0';
              setTimeout(function () {
                splash.remove();
              }, 350);
            },
            reduced ? 0 : 450,
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
