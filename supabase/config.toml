# webauthn(패스키/지문 로그인): auth-* 는 로그인 전이라 JWT 없이 호출되고, register-* 는
# 함수 내부에서 Authorization 사용자 JWT 를 검증한다. origin 은 allowlist 로 제한.
[functions.webauthn]
verify_jwt = false

